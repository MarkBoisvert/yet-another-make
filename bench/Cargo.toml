[package]
name = "bench"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Benchmark project generator and runner comparing yam against CMake + ninja"
publish = false

[lints]
workspace = true

[dependencies]
yet-another-make = { path = ".." }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"

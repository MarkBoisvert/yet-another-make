name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt + package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo package --locked

  test:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Toolchain discovery's test (src/toolchain) must find Clang 22, clang-scan-deps
      # and libc++'s std module sources on Linux and macOS when CI is set. Windows has
      # no libc++ yet, so there it may skip. Each OS uses its native package source,
      # which is far smaller than LLVM's ~2 GB release tarballs.
      - name: Install Clang 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y clang-tools-22 libc++-22-dev libc++abi-22-dev
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Install Clang 22 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
      - name: Install Clang 22 (Windows)
        if: runner.os == 'Windows'
        # The runner image ships an older LLVM through Chocolatey, so upgrade to the pin.
        run: |
          choco upgrade llvm --version=22.1.8 --allow-downgrade -y --no-progress
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - name: Check Clang version
        shell: bash
        run: |
          version="$(clang++ --version)"
          echo "$version"
          grep -q "version 22\." <<< "$version"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

[package]
name = "yet-another-make"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Cargo-style build tool for modern C++ (C++20 modules first). Installs the `yam` binary."
repository = "https://github.com/MarkBoisvert/yet-another-make"
readme = "README.md"
keywords = ["cpp", "build-tool", "modules", "cargo", "clang"]
categories = ["development-tools::build-utils", "command-line-utilities"]
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

# This only activates mimalloc when compiling for a musl environment
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.43"

[[bin]]
name = "yam"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "color"] }
git2 = "0.21.0"

[dev-dependencies]
tempfile = "3.27.0"

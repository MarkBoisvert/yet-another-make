[package]
name = "yet-another-make"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Cargo-style build tool for modern C++ (C++20 modules first). Installs the `yam` binary."
repository = "https://github.com/MarkBoisvert/yet-another-make"
readme = "README.md"
keywords = ["cpp", "build-tool", "modules", "cargo", "clang"]
categories = ["development-tools::build-utils", "command-line-utilities"]
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lib]
name = "yet_another_make"
path = "src/lib.rs"

[[bin]]
name = "yam"
path = "src/main.rs"

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
mimalloc = "0.1.43"
clap = { version = "4.6.6", features = ["derive", "color"] }
git2 = "0.21.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
thiserror = "2.0.21"
globset = "0.4.20"
walkdir = "2.5.0"
serde_ignored = "0.1.14"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

[workspace]
members = [".", "bench"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
